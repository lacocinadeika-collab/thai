<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonos thai · práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient tutor, warm and exact
   IDEA: the workbook's green chapter tabs + the teacher's tone hand-signs
   PICTURE: each phrase drawn as coloured tone curves, with your own voice traced over them
   COLOUR and TYPE: workbook green, five tone colours, Mitr headings + Sarabun text (Thai school faces)
   LAYOUT: one calm column, phone first; big mic button at thumb height */
:root{color-scheme:light dark;--bg:light-dark(#f6f8f4,#0f1612);--card:light-dark(#fff,#18221c);--ink:light-dark(#14211a,#e7efe9);--mute:light-dark(#5b6b61,#9db0a4);--line:light-dark(#d9e3dc,#2a3a30);
--g:light-dark(#1f7a46,#3fbf76);--gd:light-dark(#165c34,#2f9a5d);--gs:light-dark(#e3f2e8,#1b3325);
--M:light-dark(#5f6f86,#9fb0c8);--L:light-dark(#2563d6,#6ea2ff);--F:light-dark(#d92d2a,#ff6b63);--H:light-dark(#df8a00,#ffb43c);--R:light-dark(#8136e8,#b98bff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Sarabun,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Mitr,Sarabun,sans-serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--H);outline-offset:2px}
.top{background:var(--g);color:#fff;padding:18px max(5vw,16px) 22px;padding-top:max(18px,env(safe-area-inset-top))}
.top .row{display:flex;align-items:center;gap:10px;max-width:720px;margin:auto}
.top h1{flex:1;font-size:24px}.top small{display:block;font:14px Sarabun;opacity:.85}
.ib{min-width:44px;min-height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:0 12px}
main{max-width:720px;margin:auto;padding:16px max(4vw,14px) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.mute{color:var(--mute)}.small{font-size:14px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;background:var(--gs);color:var(--gd);font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.p{background:var(--g);color:#fff}.btn.w{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.tn{border-radius:14px;padding:10px 4px;text-align:center;border:2px solid currentColor;background:var(--card)}
.tn b{display:block;font:600 15px Mitr,Sarabun,sans-serif}.tn span{font-size:12px;color:var(--mute)}
.ch{display:flex;gap:14px;align-items:flex-start}
.chn{flex:none;width:54px;height:54px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font:600 24px Mitr}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);text-align:left;min-height:48px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.dot.ok{background:var(--g);border-color:var(--g);color:#fff}
.steps .sc{margin-left:auto;font-size:14px;color:var(--mute)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 0}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;margin:10px 0 4px}
.sy{display:flex;flex-direction:column;align-items:center;padding:2px 3px;border-radius:10px}
.sy .th{font:600 34px/1.25 Sarabun}.sy .ro{font-size:14px;font-weight:600}
.sy svg{width:34px;height:20px}
.wgap{width:14px}
.es{text-align:center;font-size:18px;margin:6px 0 0}
.hid .th,.hid .ro{filter:blur(9px)}
.mic{cursor:pointer;width:88px;height:88px;border-radius:50%;background:var(--F);color:#fff;display:grid;place-items:center;margin:16px auto 4px;box-shadow:0 6px 18px rgba(217,45,42,.35);position:relative}
.mic svg{width:36px;height:36px}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(217,45,42,.15)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.lvl{height:6px;max-width:200px;margin:6px auto 0;border-radius:4px;background:var(--line);overflow:hidden}.lvl i{display:block;height:100%;width:0;background:var(--F)}
.res{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.big{font:600 46px/1 Mitr;text-align:center}
.fig{position:relative;height:190px;margin:10px 0}.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border-radius:12px;padding:6px 10px;font-size:14px;border:2px solid var(--line);text-align:center;line-height:1.25}
.chip.ok{border-color:var(--g)}.chip.mid{border-color:var(--H)}.chip.bad{border-color:var(--F)}
.chip b{display:block;font-size:17px}
.opt{width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:8px;min-height:52px;background:var(--card)}
.opt.ok{border-color:var(--g);background:var(--gs)}.opt.bad{border-color:var(--F)}
.pic{background:#fff;border-radius:14px;padding:8px;display:grid;place-items:center;margin:-4px 0 6px;border:1px solid var(--line)}.pic img{max-width:100%;max-height:220px;object-fit:contain;display:block}
.opt .pic img{max-height:110px}
.note{background:light-dark(#fff6e3,#2b2412);border:1px solid light-dark(#f1d79c,#5c4a1d);border-radius:14px;padding:12px 14px;font-size:15px;margin:12px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;margin:8px 0 14px}.seg button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line)}.seg button.on{border-color:var(--g);background:var(--gs);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute);justify-content:center}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<header class="top"><div class="row">
  <button class="ib" id="back" aria-label="Volver" style="display:none">←</button>
  <h1 id="ttl">Tonos thai<small>Conversational Thai for Beginner · cap. 1–3</small></h1>
  <button class="ib" id="cfg" aria-label="Ajustes">Ajustes</button>
</div></header>
<main id="app"></main>
<div class="sheet" id="sheet"><div id="sheetIn"></div></div>
<script>
// Tone engine: pitch tracking (YIN), syllable segmentation, tone classification.
// Works on mono Float32Array at 16 kHz.
var TONE = {
  SR: 16000, HOP: 160, WIN: 640,
  // Templates: semitones relative to the speaker's mid level, 5 points over the syllable.
  T: {
    M: [0.3, 0, -0.3, -0.6, -1.0],
    L: [-1.0, -2.0, -2.8, -3.4, -3.8],
    F: [1.8, 2.8, 2.2, 0, -3.5],
    H: [0.6, 0.8, 1.6, 3.0, 3.8],
    R: [-1.0, -2.4, -2.6, -1.0, 2.6]
  },
  yin: function (x) {
    var SR = this.SR, HOP = this.HOP, W = this.WIN, tmin = Math.floor(SR / 500), tmax = Math.ceil(SR / 70);
    var n = Math.max(0, Math.floor((x.length - W - tmax) / HOP));
    var f0 = new Float32Array(n), ap = new Float32Array(n), rms = new Float32Array(n);
    var d = new Float32Array(tmax + 2);
    for (var i = 0; i < n; i++) {
      var o = i * HOP, s = 0;
      for (var k = 0; k < W; k++) s += x[o + k] * x[o + k];
      rms[i] = Math.sqrt(s / W);
      if (rms[i] < 1e-4) { f0[i] = 0; ap[i] = 1; continue; }
      d[0] = 1; var run = 0, best = -1;
      for (var t = 1; t <= tmax; t++) {
        var acc = 0;
        for (var j = 0; j < W; j++) { var df = x[o + j] - x[o + j + t]; acc += df * df; }
        run += acc; d[t] = run > 0 ? acc * t / run : 1;
      }
      for (t = tmin; t <= tmax; t++) {
        if (d[t] < 0.2) { while (t + 1 <= tmax && d[t + 1] < d[t]) t++; best = t; break; }
      }
      if (best < 0) { var mn = 9; for (t = tmin; t <= tmax; t++) if (d[t] < mn) { mn = d[t]; best = t; } }
      var a = d[best - 1] || d[best], b = d[best], c = d[best + 1] || d[best];
      var den = a - 2 * b + c, sh = den ? 0.5 * (a - c) / den : 0;
      if (Math.abs(sh) > 1) sh = 0;
      f0[i] = SR / (best + sh); ap[i] = b;
    }
    return { f0: f0, ap: ap, rms: rms };
  },
  median: function (a) { var b = Array.prototype.slice.call(a).sort(function (p, q) { return p - q; }); return b.length ? b[b.length >> 1] : 0; },
  // Returns voiced pitch track (Hz, 0 = unvoiced) after cleanup.
  track: function (x) {
    var r = this.yin(x), n = r.f0.length, maxR = 0, i;
    for (i = 0; i < n; i++) if (r.rms[i] > maxR) maxR = r.rms[i];
    var sortedR = Array.prototype.slice.call(r.rms).sort(function (p, q) { return p - q; });
    var floor = sortedR[Math.floor(n * 0.1)] || 0;
    var thr = Math.max(maxR * 0.06, floor * 3);
    var v = new Float32Array(n);
    for (i = 0; i < n; i++) v[i] = (r.rms[i] > thr && r.ap[i] < 0.35) ? r.f0[i] : 0;
    var vv = []; for (i = 0; i < n; i++) if (v[i]) vv.push(v[i]);
    var med = this.median(vv);
    // octave correction + outlier removal
    for (i = 0; i < n; i++) if (v[i]) {
      var q = v[i] / med;
      if (q > 1.75) v[i] /= 2; else if (q < 0.58) v[i] *= 2;
      q = v[i] / med; if (q > 1.9 || q < 0.5) v[i] = 0;
    }
    // median smoothing over voiced neighbours
    var out = new Float32Array(n);
    for (i = 0; i < n; i++) {
      if (!v[i]) continue; var w = [];
      for (var k = -2; k <= 2; k++) if (v[i + k]) w.push(v[i + k]);
      out[i] = this.median(w);
    }
    // drop isolated voiced frames
    for (i = 0; i < n; i++) if (out[i] && !out[i - 1] && !out[i + 1]) out[i] = 0;
    return { f0: out, rms: r.rms, med: med };
  },
  // Split voiced frames into exactly N syllable segments [start,end).
  segment: function (tr, N) {
    var f = tr.f0, rms = tr.rms, n = f.length, runs = [], i, s = -1;
    for (i = 0; i <= n; i++) {
      var on = i < n && f[i] > 0;
      if (on && s < 0) s = i;
      if (!on && s >= 0) { if (i - s >= 3) runs.push([s, i]); s = -1; }
    }
    if (!runs.length) return [];
    // merge tiny gaps (<3 frames) are kept separate only if needed; first drop very short runs when too many
    while (runs.length > N) {
      var len = runs.map(function (r) { return r[1] - r[0]; });
      var mi = 0; for (i = 1; i < runs.length; i++) if (len[i] < len[mi]) mi = i;
      if (len[mi] < 6) { runs.splice(mi, 1); continue; }
      var gi = 0, gb = 1e9;
      for (i = 0; i < runs.length - 1; i++) { var g = runs[i + 1][0] - runs[i][1]; if (g < gb) { gb = g; gi = i; } }
      runs.splice(gi, 2, [runs[gi][0], runs[gi + 1][1]]);
    }
    while (runs.length < N) {
      // split the longest run at its deepest energy valley (or in the middle)
      var li = 0; for (i = 1; i < runs.length; i++) if (runs[i][1] - runs[i][0] > runs[li][1] - runs[li][0]) li = i;
      var a = runs[li][0], b = runs[li][1], L = b - a;
      if (L < 6) break;
      var lo = a + Math.floor(L * 0.2), hi = b - Math.floor(L * 0.2), cut = (a + b) >> 1, cv = 1e9;
      for (i = lo; i < hi; i++) {
        var e = (rms[i - 1] + rms[i] + rms[i + 1]) / 3;
        var pen = e * (1 + 0.6 * Math.abs(i - (a + b) / 2) / L);
        if (pen < cv) { cv = pen; cut = i; }
      }
      runs.splice(li, 1, [a, cut], [cut, b]);
    }
    return runs;
  },
  contour: function (tr, seg, ref) {
    var f = tr.f0, a = seg[0], b = seg[1], L = b - a, pts = [], lo = a + Math.floor(L * 0.08), hi = b - Math.floor(L * 0.08);
    var vals = []; for (var i = lo; i < hi; i++) if (f[i]) vals.push([i, 12 * Math.log2(f[i] / ref)]);
    if (vals.length < 3) return null;
    for (var k = 0; k < 5; k++) {
      var c = vals[0][0] + (vals[vals.length - 1][0] - vals[0][0]) * k / 4, ws = 0, acc = 0;
      vals.forEach(function (v) { var w = Math.exp(-Math.pow((v[0] - c) / Math.max(1.5, L / 8), 2)); ws += w; acc += w * v[1]; });
      pts.push(acc / ws);
    }
    return pts;
  },
  classify: function (u, levelW) {
    var self = this, um = u.reduce(function (p, q) { return p + q; }, 0) / 5, res = {};
    Object.keys(this.T).forEach(function (k) {
      var t = self.T[k], tm = t.reduce(function (p, q) { return p + q; }, 0) / 5, sh = 0;
      for (var i = 0; i < 5; i++) { var e = (u[i] - um) - (t[i] - tm); sh += e * e * (i === 4 || i === 0 ? 0.7 : 1); }
      sh /= 4.4;
      var lv = um - tm;
      res[k] = sh + levelW * lv * lv;
    });
    return res;
  },
  score: function (dist, target) {
    var min = Math.min.apply(null, Object.keys(dist).map(function (k) { return dist[k]; }));
    var best = Object.keys(dist).filter(function (k) { return dist[k] === min; })[0];
    var rel = Math.exp(-(dist[target] - min) / 1.2), abs = Math.exp(-dist[target] / 6);
    return { best: best, score: Math.round(100 * (0.65 * rel + 0.35 * abs)) };
  },
  // Main entry. tones: array of tone letters. ref: Hz of the speaker's mid level (or 0 = estimate)
  analyze: function (x, tones, ref) {
    var tr = this.track(x), N = tones.length;
    var segs = this.segment(tr, N);
    var voiced = 0; for (var i = 0; i < tr.f0.length; i++) if (tr.f0[i]) voiced++;
    if (voiced < 8) return { ok: false, why: 'silence' };
    var est = !ref; if (est) ref = tr.med * Math.pow(2, 0.3 / 12);
    var multi = N > 2, levelW = multi ? 0.12 : 0.3, self = this;
    var syl = tones.map(function (t, k) {
      var sg = segs[k];
      if (!sg) return { target: t, ok: false };
      var c = self.contour(tr, sg, ref);
      if (!c) return { target: t, ok: false, seg: sg };
      var d = self.classify(c, levelW), s = self.score(d, t);
      // short stopped syllables: be lenient about rising/high & low/falling confusion
      return { target: t, ok: true, seg: sg, c: c, best: s.best, score: s.score };
    });
    var got = syl.filter(function (s) { return s.ok; });
    var sc = syl.map(function (s) { return s.ok ? s.score : 20; });
    var mean = sc.reduce(function (p, q) { return p + q; }, 0) / N, worst = Math.min.apply(null, sc);
    var total = got.length ? Math.round(N > 1 ? 0.65 * mean + 0.35 * worst : mean) : 0;
    return { ok: true, f0: tr.f0, ref: ref, syl: syl, total: total, segCount: segs.length };
  }
};


// Lexicon: thai -> [ [syllable thai, roman, tone], ... ]  (tones: M L F H R)

    'สวัสดี': 'สะ sà L|หวัด wàt L|ดี dee M', 'ค่ะ': 'ค่ะ kâ F', 'คะ': 'คะ ká H', 'ครับ': 'ครับ kráp H',
    'ขอบคุณ': 'ขอบ kòp L|คุณ kun M', 'ขอโทษ': 'ขอ kǒr R|โทษ tôht F', 'ไม่เป็นไร': 'ไม่ mâi F|เป็น bpen M|ไร rai M',
    'ฉัน': 'ฉัน chǎn R', 'ผม': 'ผม pǒm R', 'คุณ': 'คุณ kun M', 'พ่อ': 'พ่อ pôr F', 'แม่': 'แม่ mâe F',
    'เพื่อน': 'เพื่อน pêuan F', 'แฟน': 'แฟน faen M', 'ภรรยา': 'พัน pan M|ระ rá H|ยา yaa M', 'สามี': 'สา sǎa R|มี mee M',
    'ชื่อ': 'ชื่อ chêu F', 'อะไร': 'อะ à L|ไร rai M', 'สบายดี': 'สะ sà L|บาย baai M|ดี dee M', 'ไหม': 'ไหม mái H', 'มั้ย': 'มั้ย mái H', 'สมชาย': 'สม sǒm R|ชาย chaai M', 'คุณครู': 'คุณ kun M|ครู kroo M',
    'เหมียว': 'เหมียว Mǐeow R', 'คุณพ่อ': 'คุณ kun M|พ่อ pôr F', 'คุณแม่': 'คุณ kun M|แม่ mâe F',
    'ศูนย์': 'ศูนย์ sǔun R', 'หนึ่ง': 'หนึ่ง nèung L', 'สอง': 'สอง sǒng R', 'สาม': 'สาม sǎam R', 'สี่': 'สี่ sèe L',
    'ห้า': 'ห้า hâa F', 'หก': 'หก hòk L', 'เจ็ด': 'เจ็ด jèt L', 'แปด': 'แปด bpàet L', 'เก้า': 'เก้า gâo F', 'สิบ': 'สิบ sìp L',
    'เอ็ด': 'เอ็ด èt L', 'ยี่': 'ยี่ yêe F', 'ร้อย': 'ร้อย rói H', 'พัน': 'พัน pan M', 'หมื่น': 'หมื่น mèun L', 'แสน': 'แสน sǎen R', 'ล้าน': 'ล้าน láan H',
    'อายุ': 'อา aa M|ยุ yú H', 'เท่าไหร่': 'เท่า tâo F|ไหร่ rài L', 'กี่': 'กี่ gèe L', 'ปี': 'ปี bpee M', 'ราคา': 'รา raa M|คา kaa M',
    'บาท': 'บาท bàat L', 'เหรียญ': 'เหรียญ rǐan R', 'แบงก์': 'แบงก์ báeng H', 'ขอ': 'ขอ kǒr R', 'มี': 'มี mee M',
    'ชอบ': 'ชอบ chôp F', 'ดื่ม': 'ดื่ม dèum L', 'กิน': 'กิน gin M', 'อัน': 'อัน an M', 'นี้': 'นี้ née H', 'นี่': 'นี่ nêe F',
    'นั้น': 'นั้น nán H', 'นั่น': 'นั่น nân F', 'น้ำ': 'น้ำ náam H', 'ข้าว': 'ข้าว kâao F', 'ก๋วยเตี๋ยว': 'ก๋วย gǔay R|เตี๋ยว dtǐeow R',
    'เรียน': 'เรียน rian M', 'ภาษา': 'ภา paa M|ษา sǎa R', 'ไทย': 'ไทย tai M', 'ไม่': 'ไม่ mâi F', 'เอา': 'เอา ao M',
    'ใคร': 'ใคร krai M', 'พี่': 'พี่ pêe F', 'น้อง': 'น้อง nóng H', 'ครู': 'ครู kroo M', 'กับ': 'กับ gàp L', 'มาก': 'มาก mâak F'
  };
  var o = {};
  Object.keys(raw).forEach(function (k) { o[k] = raw[k].split('|').map(function (s) { return s.split(' '); }); });
  return o;
})();

// Thai number -> list of lexicon words
function numWords(n) {
  if (n === 0) return ['ศูนย์'];
  var D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], U = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function below(m) {
    var w = [], s = String(m), L = s.length;
    for (var i = 0; i < L; i++) {
      var d = +s[i], p = L - 1 - i;
      if (!d) continue;

}

  for (let i = 0; i < n; i++) { const c = Math.floor(i * r); let s = 0; for (let k = 0; k < w; k++) s += d[c + k] || 0; out[i] = s / w; }

// mic button: calls onAudio(samples, blobUrl)
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>';
function micButton(host, onAudio, label) {
  const render = note => {
    const live = micMode === 'live';
    host.innerHTML = (live ? `<button class="mic" aria-label="Grabar">${MIC_SVG}</button>`
      : `<label class="mic" aria-label="Grabar">${MIC_SVG}<input type="file" accept="audio/*" capture style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></label>`) +

    msg.textContent = 'Analizando…';

    }
    b.onclick = async () => {
      hush();
      if (recState) { const st = recState; recState = null; b.classList.remove('on'); lv.style.width = 0; process(await st.stop(), msg); return; }
      try {
        msg.textContent = 'Abriendo el micrófono…';
        const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
        const live = startLive(m => lv.style.width = Math.min(100, m * 160) + '%');
        if (framed) {

          live.then(st => { if (timedOut) st.stop(); }).catch(() => {});

      } catch (e) {
        recState = null;
        const framed = (() => { try { return window.self !== window.top; } catch (x) { return true; } })();
        if (framed) { micMode = 'file'; render('Aquí no se puede usar el micrófono en vivo. <b>Toca el micrófono</b> y elige <b>Grabadora</b> para grabarte.'); }
        else msg.innerHTML = 'No pude abrir el micrófono (' + esc(e.name || '') + ' ' + esc(e.message || '') + '). Toca otra vez.';

}

/* ---------- word recognition (optional) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let dict = null;

function lev(a, b) { const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
function listenWords(target, out) {
  const norm = s => s.replace(/[\s.,?!]/g, '');
  const show = txt => { const t = norm(target), h = norm(txt), sim = Math.max(0, 1 - lev(t, h) / Math.max(t.length, 1));
    out.innerHTML = `<p style="margin:8px 0 0">Entendí: <b style="font-size:20px">${esc(txt) || '—'}</b><br><span class="mute small">Coincidencia de palabras: ${Math.round(sim * 100)}%</span></p>`; };
  out.innerHTML = '<p class="mute small">Escuchando… di la frase</p>';
  if (SR) { const r = new SR(); r.lang = 'th-TH'; r.interimResults = false; r.maxAlternatives = 3;
    r.onresult = e => show(e.results[0][0].transcript); r.onerror = e => out.innerHTML = `<p class="mute small">El reconocimiento no está disponible aquí (${esc(e.error)}).</p>`; r.start(); return; }
  if (dict) { let txt = ''; dict.onFinal(({text}) => { txt += text; show(txt); }); dict.start().catch(() => out.innerHTML = '<p class="mute small">No hay permiso para dictado.</p>'); setTimeout(() => dict.stop().catch(() => {}), 5000); }
}

/* ---------- "¿se entiende?" scoring (speech recognition) ---------- */
let srBroken = false;
const scoreMode = () => (S.mode === 'tone' || srBroken || !(SR || dict)) ? 'tone' : 'words';
function normTh(s) {
  s = String(s).replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
  s = s.replace(/\d[\d,.]*/g, m => { const n = parseInt(m.replace(/[,.]/g, ''), 10); return isNaN(n) ? '' : numWords(n).join(''); });
  s = s.replace(/[\s.,!?'"()\-–—…]/g, '').replace(/มั้ย|มั๊ย|มัย/g, 'ไหม').replace(/เท่าไหร่|เท่าไหร/g, 'เท่าไร').replace(/แบงค์|แบ้งค์/g, 'แบงก์')
    .replace(/คับ/g, 'ครับ').replace(/ค่า/g, 'ค่ะ');

}
const stripP = s => s.replace(/ครับ|ค่ะ|คะ|นะ/g, '');

  const f = (a, b) => a.length ? Math.max(0, 1 - lev(a, b) / Math.max(a.length, 1)) : 0;

}
function wordsMic(host, it, res, opts) {
  host.innerHTML = `<button class="mic" aria-label="Hablar">${MIC_SVG}</button><p class="mute small" style="text-align:center;margin:6px 0 0">Toca y di la frase. Te digo si se entiende.</p>`;

    alts = alts.filter(Boolean); if (!alts.length) { msg.textContent = 'No te escuché. Toca y habla un poco más fuerte.'; return; }

      <p style="text-align:center;margin:4px 0 0"><b>${verdict}</b></p>
      <p style="text-align:center;margin:10px 0 4px" class="mute small">Lo que entendió el reconocimiento de voz:</p>

/* ---------- pitch chart ---------- */
function drawChart(cv, r, it) {
  const draw = () => {
    const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1; cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);

    const f = r.f0; let a = f.findIndex(v => v > 0), b = f.length - 1; while (b > 0 && !f[b]) b--; a = Math.max(0, a - 4); b = Math.min(f.length - 1, b + 4);
    const X = i => 8 + (i - a) / Math.max(1, b - a) * (W - 16), Y = st => H / 2 - st * (H / 2 - 18) / 8;
    g.strokeStyle = col('line'); g.lineWidth = 1; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke(); g.setLineDash([]);
    g.fillStyle = col('mute'); g.font = '12px Sarabun'; g.fillText('tu tono medio', 6, Y(0) - 5);
    const syl = it.words.flatMap(w => w.syl);
    r.syl.forEach((s, k) => { if (!s.seg) return; const t = TONE.T[s.target], x0 = X(s.seg[0]), x1 = X(s.seg[1]);
      g.strokeStyle = col(s.target); g.globalAlpha = .28; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath();
      t.forEach((v, i) => { const x = x0 + (x1 - x0) * i / 4; i ? g.lineTo(x, Y(v)) : g.moveTo(x, Y(v)); }); g.stroke(); g.globalAlpha = 1;
      g.fillStyle = col(s.target); g.font = '600 14px Sarabun'; g.textAlign = 'center'; g.fillText(syl[k] ? syl[k][0] : '', (x0 + x1) / 2, H - 4); g.textAlign = 'start'; });
    g.fillStyle = col('ink'); probe.remove(); for (let i = a; i <= b; i++) if (f[i]) { const st = 12 * Math.log2(f[i] / r.ref); g.beginPath(); g.arc(X(i), Y(Math.max(-9, Math.min(9, st))), 2.2, 0, 7); g.fill(); }
  };
  draw(); new ResizeObserver(draw).observe(cv);
}

/* ---------- lessons ---------- */
const lessonItems = c => {
  const a = c.vocab.map(v => build(v[0], v[1], v[2])).concat(c.sent.map(s => build(s[0], s[1], s[2], true)));
  const seen = new Set(a.map(it => it.th));
  (c.extra || []).forEach(s => { const it = build(s[0], s[1], s[2], true); if (!seen.has(it.th)) { seen.add(it.th); it.extra = true; a.push(it); } });
  return a;
};

}
function avgScore(keys) { const v = keys.map(k => S.prog[k]).filter(Boolean); return v.length ? Math.round(v.reduce((p, q) => p + q.b, 0) / v.length) : null; }
function setTop(t, sub, back) { $('#ttl').innerHTML = esc(t) + (sub ? `<small>${esc(sub)}</small>` : ''); $('#back').style.display = back ? '' : 'none'; scrollTo(0, 0); }
$('#back').onclick = () => { hush(); home(); };

// The main flow: picture → listen → repeat → score → next
function lesson(c, start) {
  const items = lessonItems(c), my = ++RUN;
  let i = start != null ? start : (S.pos[c.n] || 0); if (i >= items.length) i = 0;
  const show = () => {
    if (RUN !== my) return;
    S.pos[c.n] = i; save();
    if (i >= items.length) return finish();
    const it = items[i], part = i < c.vocab.length ? 'Vocabulario' : it.extra ? 'Diálogos y tareas' : 'Frases';
    setTop('Cap. ' + c.n + ' · ' + part, c.title, true);
    app.innerHTML = `<div class="mute small">${i + 1} de ${items.length}</div><div class="bar"><i style="width:${i / items.length * 100}%"></i></div><div id="pc"></div>
      <div class="btns" style="flex-wrap:nowrap"><button class="btn" id="prev" ${i ? '' : 'disabled style="opacity:.4"'}>← Anterior</button><button class="btn p" style="flex:1" id="next">Siguiente →</button></div>`;
    practice($('#pc'), it, {autoplay: true});
    $('#next').onclick = () => { i++; show(); };
    $('#prev').onclick = () => { if (i) { i--; show(); } };
  };
  const finish = () => {
    const avg = avgScore(items.map(it => it.key));
    app.innerHTML = `<div class="card" style="text-align:center"><h2>¡Capítulo ${c.n} terminado!</h2><div class="big" style="margin:14px 0">${avg != null ? avg : '✓'}</div>
      <p class="mute">Nota media de tus mejores intentos. Repite el capítulo hasta superar 75 antes de tu próxima clase.</p>
      <div class="btns" style="justify-content:center"><button class="btn" id="again">Repetir capítulo</button><button class="btn p" id="home">Volver al inicio</button></div></div>`;
    $('#again').onclick = () => lesson(c, 0); $('#home').onclick = home;
  };
  show();
}

// generic queue (tone drill, review, numbers)
function queue(title, sub, items) {
  let i = 0; const my = ++RUN; setTop(title, sub, true);
  const show = () => {
    if (RUN !== my) return;
    if (i >= items.length) { home(); return; }
    app.innerHTML = `<div class="mute small">${i + 1} de ${items.length}</div><div class="bar"><i style="width:${i / items.length * 100}%"></i></div><div id="pc"></div>
      <div class="btns"><button class="btn w p" id="next">${i + 1 < items.length ? 'Siguiente →' : 'Terminar'}</button></div>`;
    practice($('#pc'), items[i], {autoplay: true});
    $('#next').onclick = () => { i++; show(); };
  };
  show();
}
function extra(c, id) {
  const sub = 'Capítulo ' + c.n + ' · ' + c.title;
  if (id === 'oido') toneQuiz(c, sub);
  else if (id === 'escucha') meaningQuiz(c, sub);
  else if (id === 'num') { const lv = [[0, 10], [11, 99], [100, 999], [1000, 99999], [100000, 2000000]];
    queue('Números al azar', sub, lv.flatMap(([a, b]) => [0, 1].map(() => { let n = a + Math.floor(Math.random() * (b - a + 1)); if (n > 9999) n = Math.round(n / 1000) * 1000; else if (n > 999) n = Math.round(n / 50) * 50; return numItem(n); }))); }
  else if (id === 'pick') {
    const items = lessonItems(c); setTop('Ir a una tarjeta', sub, true);
    app.innerHTML = `<div class="card">${items.map((it, k) => `<button class="opt" data-k="${k}"><b lang="th">${esc(it.th)}</b> <span class="mute small">· ${esc(it.es)}</span>${S.prog[it.key] ? ` <span class="small" style="float:right">${S.prog[it.key].b}</span>` : ''}</button>`).join('')}</div>`;
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => lesson(c, +b.dataset.k));
  }
}
function quizShell(title, sub, rounds, render) {
  let i = 0, ok = 0; const my = ++RUN; setTop(title, sub, true);
  const next = () => {
    if (RUN !== my) return;
    if (i >= rounds.length) { const pct = Math.round(ok / rounds.length * 100);
      app.innerHTML = `<div class="card" style="text-align:center"><h2>${ok} de ${rounds.length} correctas</h2><div class="big" style="margin:14px 0">${pct}%</div>
      <div class="btns" style="justify-content:center"><button class="btn" id="again">Otra ronda</button><button class="btn p" id="home">Volver al inicio</button></div></div>`;
      $('#again').onclick = () => quizShell(title, sub, shuffle(rounds), render); $('#home').onclick = home; return; }
    app.innerHTML = `<div class="mute small">${i + 1} de ${rounds.length}</div><div class="bar"><i style="width:${i / rounds.length * 100}%"></i></div><div class="card" id="q"></div>`;
    render($('#q'), rounds[i], good => { if (good) ok++; i++; setTimeout(next, good ? 900 : 2200); });
  };
  next();
}
const glossOf = w => (CH.flatMap(c => c.vocab).find(v => v[0] === w) || [0, GLOSS_EXTRA[w] || ''])[1];
function toneQuiz(c, sub) {
  const single = [...new Set(c.vocab.map(v => v[0]).filter(w => LEX[w].length === 1))];
  const rounds = shuffle(single).slice(0, 8).map(w => ({type: 'tone', w})).concat(c.pairs.flatMap(p => [0, 1].map(k => ({type: 'pair', p, w: p[k]}))));
  quizShell('Oído de tonos', sub, shuffle(rounds), (el, r, done) => {
    const play = () => say(r.w, 0.8);
    if (r.type === 'tone') {
      el.innerHTML = `<h3>¿Qué tono tiene esta palabra?</h3><div class="btns"><button class="btn p" id="pl">▶ Escuchar otra vez</button></div>
      <div class="tones">${ORDER.map(t => `<button class="tn" style="color:var(--${t})" data-t="${t}">${toneSvg(t, 40, 24)}<b>${SHORT[t]}</b></button>`).join('')}</div><div id="fb"></div>`;
      el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = LEX[r.w][0][2], good = b.dataset.t === t;
        el.querySelector('#fb').innerHTML = `<p style="text-align:center;margin-top:12px">${good ? '✓ ¡Correcto!' : '✗ Era <b style="color:var(--' + t + ')">' + TN[t][0] + '</b>'}</p>` + wordHtml(build(r.w, ''));
        el.querySelectorAll('[data-t]').forEach(x => x.disabled = true); done(good); });
    } else {
      el.innerHTML = `<h3>¿Cuál de las dos palabras oyes?</h3><div class="btns"><button class="btn p" id="pl">▶ Escuchar otra vez</button></div>
      ${r.p.map(w => `<button class="opt" data-w="${w}">${wordHtml(build(w, ''))}<span class="mute small">${esc(glossOf(w))}</span></button>`).join('')}`;
      el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const good = b.dataset.w === r.w; b.classList.add(good ? 'ok' : 'bad');
        if (!good) el.querySelector(`[data-w="${r.w}"]`).classList.add('ok'); el.querySelectorAll('[data-w]').forEach(x => x.disabled = true); done(good); });
    }
    el.querySelector('#pl').onclick = play; setTimeout(play, 300);
  });
}
function meaningQuiz(c, sub) {
  const items = c.sent.map(s => build(s[0], s[1], s[2], true));
  quizShell('Escucha y entiende', sub, shuffle(items).slice(0, 10), (el, it, done) => {
    const other = shuffle(items.filter(x => x.es !== it.es))[0], opts = shuffle([it, other]);
    el.innerHTML = `<h3>¿Qué imagen corresponde a lo que oyes?</h3><div class="btns"><button class="btn p" id="pl">▶ Escuchar</button><button class="btn" id="sl">Lento</button></div>
      ${opts.map((o, k) => `<button class="opt" data-k="${k}"><div class="pic" style="margin:0 0 6px">${imgTag(o.img)}</div>${esc(o.es)}</button>`).join('')}<div id="fb"></div>`;
    el.querySelector('#pl').onclick = () => say(it.th); el.querySelector('#sl').onclick = () => say(it.th, 0.55);
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const good = opts[b.dataset.k] === it; b.classList.add(good ? 'ok' : 'bad');
      el.querySelectorAll('[data-k]').forEach(x => x.disabled = true); el.querySelector('#fb').innerHTML = wordHtml(it); done(good); });
    setTimeout(() => say(it.th), 300);
  });
}
function toneDrill() {
  const items = ['ดี', 'บาท', 'ค่ะ', 'ครับ', 'ผม', 'ไม่', 'น้ำ', 'สาม', 'สี่', 'มั้ย'].filter(w => LEX[w]).map(w => build(w, TN[LEX[w][0][2]][0] + (glossOf(w) ? ' · ' + glossOf(w) : '')));
  queue('Los 5 tonos', 'Una sílaba, un tono', items);
}
function review() {
  const all = CH.flatMap(lessonItems);
  const tried = all.filter(it => S.prog[it.key]).sort((a, b) => S.prog[a.key].l - S.prog[b.key].l);
  if (!tried.length) { home(); app.insertAdjacentHTML('afterbegin', '<div class="note">Aún no hay nada que repasar: empieza por el capítulo 1.</div>'); return; }
  queue('Repaso', 'Tus palabras y frases más difíciles', tried.slice(0, 10));
}
function calibrate() {
  setTop('Calibrar voz', 'Para saber dónde está tu tono medio', true);
  app.innerHTML = `<div class="card"><h2>Di “aaa” relajado</h2><p>Toca el micrófono y di <b>อา… (aaa)</b> con tu voz normal, cómoda y plana, unos 2 segundos. Repite 2–3 veces; guardo el promedio.</p><div id="mic"></div><div id="out"></div></div>`;
  const vals = [];
  micButton($('#mic'), x => { const tr = TONE.track(x); const v = []; tr.f0.forEach(f => f && v.push(f));
    if (v.length < 30) { $('#out').innerHTML = '<p class="mute">Muy corto o muy bajo. Inténtalo otra vez, un poco más largo.</p>'; return; }
    vals.push(TONE.median(v)); S.ref = Math.round(TONE.median(vals)); save();
    $('#out').innerHTML = `<p style="text-align:center">Tu tono medio: <b>${S.ref} Hz</b> (${vals.length} ${vals.length > 1 ? 'muestras' : 'muestra'})</p><div class="btns" style="justify-content:center"><button class="btn p" id="ok">Listo</button></div>`;
    $('#ok').onclick = home; });
}

/* ---------- settings ---------- */
function settings() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices().filter(v => /^th/i.test(v.lang)) : [];
  $('#sheetIn').innerHTML = `<h2>Ajustes</h2>
    <p style="margin:14px 0 0"><b>Hablo como</b> <span class="mute small">(cambia ผม/ฉัน y ครับ/ค่ะ/คะ en las frases)</span></p>
    <div class="seg"><button data-g="f" class="${S.g !== 'm' ? 'on' : ''}">Mujer · ฉัน / ค่ะ</button><button data-g="m" class="${S.g === 'm' ? 'on' : ''}">Hombre · ผม / ครับ</button></div>
    ${ONLINE_TTS ? `<p style="margin:0"><b>Voz del modelo</b></p><div class="seg"><button data-sv="0" class="${!S.sysVoice ? 'on' : ''}">Google (internet)</button><button data-sv="1" class="${S.sysVoice ? 'on' : ''}">Voz del teléfono</button></div>` : ''}
    <p style="margin:0"><b>Calificar por</b></p>
    <div class="seg"><button data-m="words" class="${S.mode !== 'tone' ? 'on' : ''}">¿Se entiende?</button><button data-m="tone" class="${S.mode === 'tone' ? 'on' : ''}">Tonos</button></div>
    <p style="margin:0"><b>Velocidad del modelo</b></p>
    <div class="seg">${[[0.7, 'Lenta'], [0.85, 'Media'], [1, 'Normal']].map(([r, l]) => `<button data-r="${r}" class="${S.rate == r ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${vs.length > 1 ? `<p style="margin:0"><b>Voz thai</b></p><div class="seg" style="flex-wrap:wrap">${vs.map(v => `<button data-v="${esc(v.voiceURI)}" class="${voice && voice.voiceURI === v.voiceURI ? 'on' : ''}">${esc(v.name)}</button>`).join('')}</div>` : ''}
    <p style="margin:0"><b>Voz calibrada:</b> ${S.ref ? S.ref + ' Hz' : 'sin calibrar'}</p>
    <div class="btns"><button class="btn" id="rc">Calibrar ahora</button><button class="btn" id="rs">Borrar progreso</button><button class="btn p" id="cl">Cerrar</button></div>
    <p class="mute small" style="margin-top:16px">Cómo califico: mido la altura de tu voz (frecuencia) 100 veces por segundo, separo las sílabas y comparo la forma de cada curva con los 5 tonos del thai de Bangkok. Es una ayuda para practicar entre clases; tu profe sigue siendo la referencia final.</p>`;
  $('#sheet').classList.add('on');
  const sh = $('#sheetIn');
  sh.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => { S.sysVoice = b.dataset.sv === '1'; save(); settings(); say('สวัสดีค่ะ'); });
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mode = b.dataset.m; srBroken = false; save(); settings(); });
  sh.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.g = b.dataset.g; save(); settings(); });
  sh.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.rate = +b.dataset.r; save(); settings(); say('สวัสดี'); });
  sh.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.voice = b.dataset.v; save(); pickVoice(); settings(); say('สวัสดี'); });
  $('#rc').onclick = () => { $('#sheet').classList.remove('on'); calibrate(); };
  $('#rs').onclick = () => { S.prog = {}; S.steps = {}; save(); $('#sheet').classList.remove('on'); home(); };
  $('#cl').onclick = () => { $('#sheet').classList.remove('on'); home(); };
}
$('#cfg').onclick = settings;
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); };
const HOSTED = !FRAMED && !window.IMGDATA && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname);
function idb(mode, val) {
  return new Promise((ok, ko) => { try {
    const r = indexedDB.open('thaitones', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode === 'put' ? 'readwrite' : 'readonly'), st = tx.objectStore('kv');
      const q = mode === 'put' ? st.put(val, 'imgs') : st.get('imgs'); q.onsuccess = () => ok(q.result); q.onerror = () => ko(q.error); };
    r.onerror = () => ko(r.error);
  } catch (e) { ko(e); } });
}
function imgLoaderNote() {
  if (!HOSTED || window.IMGDATA) return '';
  return `<div class="note"><b>Falta cargar las imágenes del libro (solo una vez).</b> Toca el botón y elige el archivo <b>standalone.html</b> que tienes en Descargas. Las imágenes se quedan guardadas solo en este teléfono.
    <div class="btns"><label class="btn p" style="position:relative">Cargar imágenes<input type="file" id="imgpick" accept=".html,text/html" style="position:absolute;width:1px;height:1px;opacity:0"></label></div><p id="imgmsg" class="small" style="margin:6px 0 0"></p></div>`;
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'imgpick') return;
  const f = e.target.files[0], m = document.getElementById('imgmsg'); if (!f) return;
  m.textContent = 'Leyendo…';
  try {
    const t = await f.text(), a = t.indexOf('window.IMGDATA='), b = t.indexOf('};', a);
    if (a < 0 || b < 0) throw new Error('Ese archivo no es el standalone.html de la app.');
    const data = JSON.parse(t.slice(a + 15, b + 1));
    window.IMGDATA = data; await idb('put', data).catch(() => {});
    home();
  } catch (err) { m.textContent = err.message || 'No pude leer el archivo.'; }
});
if (HOSTED) idb('get').then(d => { if (d) window.IMGDATA = d; }).catch(() => {}).finally(home); else home();
}
</script>
